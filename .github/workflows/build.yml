name: Build, test and package hotel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start SQL Server LocalDB for isolated integration tests
        shell: pwsh
        run: |
          $localDbTool = Get-ChildItem 'C:\Program Files\Microsoft SQL Server' -Filter SqlLocalDB.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$localDbTool) { throw 'SQL Server LocalDB is required on this Windows runner.' }
          & $localDbTool.FullName start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'SQL Server LocalDB did not start.' }
      - run: dotnet restore AuroraHotel.sln
      - run: dotnet build AuroraHotel.sln -c Release --no-restore
      - run: dotnet test AuroraHotel.sln -c Release --no-build --logger "trx;LogFileName=hotel-tests.trx" --results-directory TestResults
      - name: Package for Windows IIS hosting
        shell: pwsh
        run: ./scripts/publish-hosting.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AuroraHotel-hosting
          path: artifacts/AuroraHotel-hosting-*.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results
          path: TestResults/*.trx
          retention-days: 7
